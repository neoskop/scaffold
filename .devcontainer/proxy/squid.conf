# Squid config for the devcontainer egress proxy — a pure DOMAIN FILTER.
#
# Design (deliberately minimal):
#   * No caching: this is a filter, not an accelerator.
#   * Default deny: only domains in allowlist.txt get through. Everything else is a
#     fast 403 — and, importantly, a LOG LINE. The access log (docker compose logs
#     proxy) is the detection layer: watch it to extend the allowlist or to spot an
#     agent trying to reach somewhere it shouldn't.
#
# Web research is intentionally NOT handled here — that's the mcp-search sidecar
# (see docker-compose.yml), so this list stays small and stable.

http_port 3128

# Everything to stdout/stderr so `docker compose logs proxy` shows all decisions.
access_log stdio:/dev/stdout
cache_log /dev/stderr

# Pure filter — never cache anything.
cache deny all

# --- Filtering rules ------------------------------------------------------------------
# dstdomain semantics: a leading dot (".github.com") matches the apex AND all
# subdomains; entries without a dot match exactly one host.
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Order matters: first match wins.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# Don't advertise the internal topology to upstream servers.
via off
forwarded_for delete
